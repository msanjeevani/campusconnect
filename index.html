<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusConnect</title><style>body{margin:0;font:15px Arial;background:#f5f6fb;color:#182033}.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #ddd;padding:20px;box-sizing:border-box}.brand{font-size:21px;font-weight:bold;margin-bottom:20px}.brand small{display:block;font-size:11px;color:#777}.nav button{display:block;width:100%;padding:11px;margin:4px 0;border:0;border-radius:9px;text-align:left;background:#fff;cursor:pointer}.nav button.active,.nav button:hover{background:#eef0ff;color:#4d46e5;font-weight:bold}.main{flex:1;padding:25px;max-width:1200px}.top{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e4e6ee;border-radius:14px;padding:16px;margin:12px 0}.stat{font-size:28px;font-weight:bold}.muted{color:#747b8d;font-size:13px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.action{padding:17px;border:1px solid #ddd;border-radius:12px;background:#fff;text-align:left;cursor:pointer}.staffgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;background:#e8eaff;color:#4d46e5;display:grid;place-items:center;font-weight:bold}.status{font-weight:bold;font-size:12px}.ok{color:#059669}.warn{color:#d97706}.bad{color:#dc2626}.btn{padding:9px 13px;border:0;border-radius:8px;background:#4d46e5;color:white;cursor:pointer}.secondary{background:#eef0f6;color:#333}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input,.toolbar select,input,textarea{padding:10px;border:1px solid #d8dce7;border-radius:8px;width:100%;box-sizing:border-box}.toolbar>*{flex:1}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modalbox{background:white;padding:22px;border-radius:14px;width:min(650px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:12px}.map{height:350px;background:#eaf0e8;border:1px solid #ccd5c8;border-radius:14px;position:relative;overflow:hidden}.building{position:absolute;background:white;border:2px solid #aeb8c7;padding:10px;border-radius:7px;font-size:11px}.marker{position:absolute;width:15px;height:15px;border-radius:50%;background:#4d46e5;border:3px solid white}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:800px){.side{width:180px}.grid,.actions{grid-template-columns:1fr 1fr}.staffgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.app{display:block}.side{width:100%;height:auto}.grid,.actions,.staffgrid{grid-template-columns:1fr}.main{padding:14px}.toolbar{display:block}.toolbar>*{margin-bottom:7px}}</style></head><body><div id="app"></div><script>
const seed={staff:[['ST001','Prof. Lakshmi Devi','CSE','Associate Professor / Mentor','Python, Software Engineering','A-203','Available',25,30],['ST002','Mr. Arjun Kumar','CSE','Placement Officer','Placement & Career Guidance','A-110','Available',55,22],['ST003','Dr. Priya Raman','ECE','Professor / Mentor','Embedded Systems','B-204','Busy',70,55],['ST004','Ms. Kavitha S','CSE','Assistant Professor','DBMS, SQL','A-205','In Class',40,65],['ST005','Dr. Naveen Raj','IT','Professor','Cloud Computing','C-101','Available',78,28],['ST006','Ms. Divya M','Admin','Student Affairs','Certificates & Approvals','Admin Block','Available',20,72],['ST007','Mr. Santhosh P','CSE','Lab In-charge','Programming Lab','Lab-2','Offline',60,78]],requests:[['REQ1001','Leave Approval','ST001','Internship permission for 6 months','Pending Mentor Approval','2026-09-18'],['REQ1002','Bonafide Certificate','ST006','Higher studies application','Completed','2026-09-16']],appointments:[['APT1001','ST001','2026-09-18','15:30','Discuss internship permission','Confirmed']],queue:[],notes:['Internship permission request is awaiting mentor approval.','Appointment with Prof. Lakshmi Devi confirmed.']};let data=JSON.parse(localStorage.cc||'null')||seed,page='home',role='Student',q='';const save=()=>localStorage.cc=JSON.stringify(data);const S=id=>data.staff.find(x=>x[0]===id);const go=p=>{page=p;render()};function nav(){let a=role==='Student'?['home|⌂ Home','staff|⌕ Find Staff','services|▣ Services','requests|▤ Requests','appointments|◫ Appointments','queue|♧ Queue','ai|✦ CampusAI','map|⌖ Campus Map','notifications|♧ Notifications','profile|◎ My Profile']:['home|⌂ Dashboard','staff|⌕ Staff','requests|▤ Requests','appointments|◫ Appointments','queue|♧ Queue','notifications|♧ Notifications','analytics|▥ Analytics'];return a.map(x=>{let [p,l]=x.split('|');return `<button class="${page==p?'active':''}" onclick="go('${p}')">${l}</button>`}).join('')}function shell(c){document.getElementById('app').innerHTML=`<div class=app><aside class=side><div class=brand>▣ CampusConnect<small>SMART CAMPUS</small></div><div class=nav>${nav()}</div><div class=card><small>View</small><select onchange="role=this.value;page='home';render()"><option ${role==='Student'?'selected':''}>Student</option><option ${role==='Staff'?'selected':''}>Staff</option><option ${role==='Admin'?'selected':''}>Admin</option></select></div></aside><main class=main><div class=top><div><h1>${role==='Student'?'Good morning, Sanjee':'CampusConnect '+role}</h1><div class=muted>${role==='Student'?'Register #21CSE001 · Computer Science & Engineering · Year 3 - A':'Manage campus operations'}</div></div><b>● Online</b></div>${c}</main></div>${window.modal||''}`};function home(){let av=data.staff.filter(s=>s[6]==='Available').length,pe=data.requests.filter(r=>r[4]!=='Completed').length;shell(`<div class=actions><button class=action onclick="go('staff')"><b>⌕ Find Staff</b><br><span class=muted>Check availability</span></button><button class=action onclick="newReq()"><b>▤ Create Request</b><br><span class=muted>Submit approval</span></button><button class=action onclick="go('appointments')"><b>◫ Appointments</b><br><span class=muted>Book a time</span></button><button class=action onclick="go('ai')"><b>✦ CampusAI</b><br><span class=muted>Campus guidance</span></button></div><div class=grid><div class=card>Available Staff<div class=stat>${av}</div></div><div class=card>Pending Requests<div class=stat>${pe}</div></div><div class=card>Appointments<div class=stat>${data.appointments.length}</div></div><div class=card>Queue<div class=stat>${data.queue.length}</div></div></div><h2>Upcoming Appointments</h2>${data.appointments.map(a=>`<div class=card><b>${S(a[1])?.[1]}</b> · ${a[2]} ${a[3]}<div class=muted>${a[4]}</div></div>`).join('')||'<div class=card>No appointments.</div>'}`)}function staffPage(){let list=data.staff.filter(s=>(!q||s.join(' ').toLowerCase().includes(q.toLowerCase())));shell(`<h2>Find Staff</h2><div class=toolbar><input placeholder="Search name, ID, department, subject" value="${q}" oninput="q=this.value;staffPage()"><select onchange="q=this.value==='All'?'':this.value;staffPage()"><option>All</option>${[...new Set(data.staff.map(s=>s[2]))].map(d=>`<option>${d}</option>`).join('')}</select></div><div class=staffgrid>${list.map(s=>`<div class=card><div class=row><div class=avatar>${s[1].split(' ').map(x=>x[0]).slice(0,2).join('')}</div><b>${s[1]}</b></div><p class=muted>${s[3]} · ${s[2]}</p><p>${s[4]}</p><p>📍 ${s[5]} · <span class="status ${s[6]=='Available'?'ok':s[6]=='Offline'?'bad':'warn'}">${s[6]}</span></p><button class=btn onclick="viewStaff('${s[0]}')">View Profile</button> <button class="btn secondary" onclick="book('${s[0]}')">Book</button></div>`).join('')}</div>`)}function viewStaff(id){let s=S(id);window.modal=`<div class=modal><div class=modalbox><div class=row><h2>${s[1]}</h2><button onclick="modal='';render()">✕</button></div><p>${s[3]} · ${s[2]}</p><p><b>Subjects:</b> ${s[4]}</p><p><b>Office:</b> ${s[5]}</p><p><b>Status:</b> ${s[6]}</p><button class=btn onclick="newReq('${id}')">Create Request</button> <button class="btn secondary" onclick="book('${id}')">Book</button></div></div>`;render()}function newReq(pre=''){window.modal=`<div class=modal><div class=modalbox><h2>Create Request</h2><form class=form onsubmit="submitReq(event)"><label>Service<select name=type><option>Leave Approval</option><option>Internship Permission</option><option>Bonafide Certificate</option><option>General Approval</option></select></label><label>Staff<select name=staff>${data.staff.map(s=>`<option value=${s[0]} ${pre==s[0]?'selected':''}>${s[1]} – ${s[6]}</option>`).join('')}</select></label><label>Purpose<input name=purpose required placeholder="e.g. Internship permission for 6 months"></label><label>Required by<input type=date name=date required value=2026-09-18></label><label>Attach document <input type=file accept=.pdf,.jpg,.jpeg,.png></label><button class=btn>Submit Request</button></form><button class="btn secondary" onclick="modal='';render()">Cancel</button></div></div>`;render()}function submitReq(e){e.preventDefault();let f=new FormData(e.target),id='REQ'+Math.floor(Math.random()*8999+1000);data.requests.unshift([id,f.get('type'),f.get('staff'),f.get('purpose'),'Pending Mentor Approval',f.get('date')]);data.notes.unshift('Request '+id+' submitted successfully.');save();modal='';page='requests';render()}function requests(){shell(`<div class=row><h2>Requests</h2><button class=btn onclick="newReq()">+ Create Request</button></div><div class=card><table class=table><tr><th>ID</th><th>Service</th><th>Staff</th><th>Purpose</th><th>Status</th><th>Action</th></tr>${data.requests.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${S(r[2])?.[1]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${role!=='Student'&&r[4]!=='Completed'?`<button class=btn onclick="approve('${r[0]}')">Approve</button>`:'View'}</td></tr>`).join('')}</table></div>`)}function approve(id){let r=data.requests.find(x=>x[0]===id);r[4]='Approved';data.notes.unshift(id+' approved by '+role+'.');save();render()}function appointments(){shell(`<div class=row><h2>Appointments</h2><button class=btn onclick="book()">+ Book</button></div>${data.appointments.map(a=>`<div class=card><b>${S(a[1])?.[1]}</b> · ${a[2]} ${a[3]}<div class=muted>${a[4]} · ${a[5]}</div></div>`).join('')||'<div class=card>No appointments.</div>'}`)}function book(pre=''){window.modal=`<div class=modal><div class=modalbox><h2>Book Appointment</h2><form class=form onsubmit="submitBook(event)"><label>Staff<select name=staff>${data.staff.filter(s=>s[6]!=='Offline').map(s=>`<option value=${s[0]} ${pre==s[0]?'selected':''}>${s[1]} – ${s[6]}</option>`).join('')}</select></label><label>Date<input type=date name=date required value=2026-09-18></label><label>Time<input type=time name=time required value=15:30></label><label>Purpose<input name=purpose required placeholder="Reason for appointment"></label><button class=btn>Confirm Booking</button></form></div></div>`;render()}function submitBook(e){e.preventDefault();let f=new FormData(e.target);data.appointments.push(['APT'+Math.floor(Math.random()*8999+1000),f.get('staff'),f.get('date'),f.get('time'),f.get('purpose'),'Confirmed']);data.notes.unshift('Appointment booked successfully.');save();modal='';page='appointments';render()}function queue(){let m=data.queue.find(x=>x[0]==='Sanjee Vani M');shell(`<h2>Virtual Queue</h2><div class=card>${m?`<h3>Token ${m[1]}</h3><div class=stat>Position ${m[2]}</div><p>Estimated wait: ${m[2]*8} minutes</p><button class=btn onclick="data.queue=[];save();render()">Leave Queue</button>`:`<p>You are not in a queue.</p><button class=btn onclick="data.queue.push(['Sanjee Vani M','Q'+Math.floor(Math.random()*899+100),data.queue.length+1]);save();render()">Join Queue</button>`}</div>`)}function ai(){shell(`<h2>CampusAI</h2><div class=card><p>Ask about staff, requests, appointments or queue.</p><form class=toolbar onsubmit="ask(event)"><input id=aiq placeholder="How do I get internship approval?"><button class=btn>Send</button></form><div id=ans></div></div>`)}function ask(e){e.preventDefault();let q=document.getElementById('aiq').value.toLowerCase(),a=q.includes('intern')?'Open Create Request → Internship Permission, select your mentor, enter the required date and attach the document.':q.includes('appointment')?'Open Appointments → Book and choose available staff.':q.includes('queue')?'Open Queue and select Join Queue.':'Use Find Staff to search faculty by name, ID, department or subject.';document.getElementById('ans').innerHTML='<div class=card>'+a+'</div>'}function map(){shell(`<h2>Campus Map</h2><p class=muted>Free local campus-zone demo. Location sharing should be consent-based in production.</p><div class=map>${data.staff.map(s=>`<div class=building style="left:${s[7]}%;top:${s[8]}%">${s[5]}</div><div class=marker style="left:${s[7]}%;top:${s[8]}%" title="${s[1]}"></div>`).join('')}</div>`)}function notifications(){shell(`<h2>Notifications</h2>${data.notes.map(n=>`<div class=card>🔔 ${n}</div>`).join('')}`)}function profile(){shell(`<h2>My Profile</h2><div class=card><h3>Sanjee Vani M</h3><p>Register #21CSE001</p><p>Computer Science & Engineering · Year 3 - A</p><p>Privacy: consent-based location sharing</p></div>`)}function analytics(){shell(`<h2>Analytics</h2><div class=grid><div class=card>Total Requests<div class=stat>${data.requests.length}</div></div><div class=card>Completed<div class=stat>${data.requests.filter(r=>r[4]=='Completed').length}</div></div><div class=card>Available Staff<div class=stat>${data.staff.filter(s=>s[6]=='Available').length}</div></div><div class=card>Queue<div class=stat>${data.queue.length}</div></div></div>`)}function services(){shell(`<h2>Campus Services</h2><div class=grid><div class=card><b>Leave Approval</b><p class=muted>Submit approval request.</p><button class=btn onclick="newReq()">Start</button></div><div class=card><b>Internship Permission</b><p class=muted>Request permission.</p><button class=btn onclick="newReq()">Start</button></div><div class=card><b>Bonafide Certificate</b><p class=muted>Request certificate.</p><button class=btn onclick="newReq()">Start</button></div><div class=card><b>Placement Guidance</b><p class=muted>Book placement staff.</p><button class=btn onclick="book('ST002')">Book</button></div></div>`)}function render(){if(page==='home')home();else if(page==='staff')staffPage();else if(page==='services')services();else if(page==='requests')requests();else if(page==='appointments')appointments();else if(page==='queue')queue();else if(page==='ai')ai();else if(page==='map')map();else if(page==='notifications')notifications();else if(page==='profile')profile();else analytics()}render();
</script></body></html>
